

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑士 · SVG 2D 动画</title>
<link rel="preconnect" href="https://fonts.googleapis.com ">
<link rel="preconnect" href="https://fonts.gstatic.com " crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap " rel="stylesheet">
<style>
:root{--ink:#1E2A38;--paper:#FFFDF6;--coral:#FF6B4A;--red:#E8503A;--yellow:#FFD23F;--orange:#F08A24}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#0E1D38;font-family:'Noto Sans SC',sans-serif;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}

/* ---------- HUD ---------- */
.card{position:fixed;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);z-index:10}
.title{top:20px;left:22px;border-radius:18px;padding:12px 22px 12px 14px;display:flex;gap:14px;align-items:center;transform:rotate(-1.5deg);transition:transform .25s}
.title:hover{transform:rotate(0deg) scale(1.02)}
.logo{width:58px;height:58px;border-radius:14px;background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:inset -3px -3px 0 rgba(30,42,56,.15);flex:none}
h1{margin:0;font-family:'ZCOOL KuaiLe',cursive;font-weight:400;font-size:clamp(26px,3.6vw,40px);letter-spacing:5px;color:var(--ink);line-height:1.05}
h1 em{font-style:normal;color:var(--red)}
.title p{margin:5px 0 0;font-size:12px;letter-spacing:2.5px;color:#5A6B7C;font-weight:500}
.badge{position:absolute;top:-14px;right:-14px;background:var(--coral);color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;padding:4px 11px;border:3px solid var(--ink);border-radius:999px;transform:rotate(7deg);box-shadow:3px 3px 0 var(--ink)}
.dock{left:50%;bottom:18px;transform:translateX(-50%);border-radius:999px;padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;max-width:min(96vw,880px);z-index:11}
.btn{font-family:'ZCOOL KuaiLe',cursive;font-size:18px;letter-spacing:2px;color:var(--ink);background:var(--coral);border:3px solid var(--ink);border-radius:999px;padding:7px 18px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;line-height:1.3}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#E8F1F7;font-size:16px;padding:7px 12px}
.btn.ghost:hover{background:#fff}
.speed{display:flex;align-items:center;gap:12px}
.lbl{font-size:12px;letter-spacing:3px;color:#5A6B7C;font-weight:700}
.kmh{font-family:'ZCOOL KuaiLe',cursive;font-size:24px;color:var(--ink);min-width:96px;text-align:center}
.kmh small{font-family:'Noto Sans SC';font-size:11px;color:#7A8794;letter-spacing:1px;margin-left:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:180px;height:26px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;border:3px solid var(--ink);background:linear-gradient(90deg,var(--coral) var(--p,55%),#DCE7EE var(--p,55%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:var(--yellow);border:3.5px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
input[type=range]::-moz-range-track{height:12px;border-radius:99px;border:3px solid var(--ink);background:#DCE7EE}
input[type=range]::-moz-range-progress{height:12px;border-radius:99px;background:var(--coral)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--yellow);border:3.5px solid var(--ink)}
.keys{font-size:10px;letter-spacing:1.5px;color:#7A8794;white-space:nowrap}

/* ---------- 场景配色（昼夜） ---------- */
.s1,.s2,.s3{transition:stop-color 1.2s ease}
.s1{stop-color:#8ED8EE}.s2{stop-color:#CFF0F1}.s3{stop-color:#F0F9E8}
.night .s1{stop-color:#0D1B36}.night .s2{stop-color:#1B3157}.night .s3{stop-color:#31517D}
#sunG,#moonG,#starsG{transition:opacity 1.2s ease}
#moonG,#starsG{opacity:0}
.night #sunG{opacity:0}.night #moonG{opacity:1}.night #starsG{opacity:1}
.star{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.seaR{fill:#2FA3AE;transition:fill 1.2s}.night .seaR{fill:#12314E}
.sandR{fill:#F0DCA8;transition:fill 1.2s}.night .sandR{fill:#44536F}
.curbR{fill:#DBCE9D;transition:fill 1.2s}.night .curbR{fill:#2E3B55}
.asphR{fill:#4E5A66;transition:fill 1.2s}.night .asphR{fill:#1F2937}
.grassR{fill:#3F9E5F;transition:fill 1.2s}.night .grassR{fill:#153726}
.grassD{fill:#2E7D4F;transition:fill 1.2s}.night .grassD{fill:#0F2A1D}
.cloudF{fill:#fff;transition:fill 1.2s}.night .cloudF{fill:#7C93B8}
.wavesG{stroke:#fff;fill:none;stroke-width:3;opacity:.45;transition:opacity 1.2s}.night .wavesG{opacity:.22}
.foamG{stroke:#fff;fill:none;stroke-width:4;opacity:.7;transition:opacity 1.2s}.night .foamG{opacity:.4}
.palmF{fill:#2E8B5F;transition:fill 1.2s}.night .palmF{fill:#1B5038}
.bushF{fill:#37A26A;transition:fill 1.2s}.night .bushF{fill:#1B5038}
.bushL{fill:#5CC287;transition:fill 1.2s}.night .bushL{fill:#245E42}
.tuftF{stroke:#2E7D4F;transition:stroke 1.2s}.night .tuftF{stroke:#123527}
.gf{transition:opacity 1.2s}.night .gf{opacity:.45}
.dashF{fill:#EFEAD8;transition:fill 1.2s}.night .dashF{fill:#55647E}
.roadLine{fill:#C9D3DC;transition:fill 1.2s}.night .roadLine{fill:#39465A}
.spk{fill:#5A6775;transition:fill 1.2s}.night .spk{fill:#2C3947}
.lampGlowC{opacity:0;transition:opacity 1.2s}.night .lampGlowC{opacity:.95}
.lampHeadC{fill:#F7E9C0;transition:fill 1.2s}.night .lampHeadC{fill:#FFE27A}
.beamP{opacity:0;transition:opacity 1.2s}.night .beamP{opacity:.4}
.farBird{stroke:#4A6B8A;transition:stroke 1.2s}.night .farBird{stroke:#9FB4D0}

/* ---------- 角色动画 ---------- */
.eyeG{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,93.5%,97%,100%{transform:scaleY(1)}95%{transform:scaleY(.06)}}
#streaks .streak{animation:streakM .5s linear infinite}
#streaks .streak:nth-child(2){animation-delay:.16s}
#streaks .streak:nth-child(3){animation-delay:.32s}
@keyframes streakM{0%{transform:translateX(50px);opacity:0}25%{opacity:.9}100%{transform:translateX(-190px);opacity:0}}
#bubble{opacity:0;transform-box:fill-box;transform-origin:35% 100%;transform:scale(.55);transition:transform .3s cubic-bezier(.34,1.8,.5,1),opacity .2s;pointer-events:none}
#bubble.show{opacity:1;transform:scale(1)}
#bellG{transform-box:fill-box;transform-origin:50% 100%}
#bellG.ring{animation:jingle .55s ease}
@keyframes jingle{0%{transform:rotate(0)}20%{transform:rotate(-22deg)}45%{transform:rotate(16deg)}70%{transform:rotate(-9deg)}100%{transform:rotate(0)}}
#ripG circle{opacity:0;transform-box:fill-box;transform-origin:center}
#ripG.go circle{animation:rip .65s ease-out}
#ripG.go circle:nth-child(2){animation-delay:.12s}
@keyframes rip{0%{opacity:.85;transform:scale(.25)}100%{opacity:0;transform:scale(1.9)}}
#hint{transition:opacity .5s;transform-box:fill-box;animation:hintF 1.6s ease-in-out infinite alternate}
#hint.gone{opacity:0;animation:none}
@keyframes hintF{from{transform:translateY(0)}to{transform:translateY(7px)}}
#hint text{fill:#1E2A38;transition:fill 1.2s}.night #hint text{fill:#FFE9A8}
@media (prefers-reduced-motion:reduce){.streak,#hint,.eyeG,.star{animation:none}}
</style>
</head>

      </g>
      <g transform="translate(430 562)">
        <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" repeatCount="indefinite"/>
          <path d="M-36 0 L36 0 L24 16 L-24 16 Z" fill="#E8503A" stroke="#1E2A38" stroke-width="3"/>
          <rect x="-2" y="-46" width="4" height="46" fill="#1E2A38"/>

          <path d="M-2 -40 L-2 -6 L-24 -6 Z" fill="#FFD23F" stroke="#1E2A38" stroke-width="3"/>

      </g>
      <g transform="translate(1150 506)" fill="#2F6E7E" opacity=".85">

      <g class="dashF" opacity=".92">
        <rect x="20" y="764" width="60" height="10" rx="5"/><rect x="120" y="764" width="60" height="10" rx="5"/><rect x="220" y="764" width="60" height="10" rx="5"/><rect x="320" y="764" width="60" height="10" rx="5"/><rect x="420" y="764" width="60" height="10" rx="5"/><rect x="520" y="764" width="60" height="10" rx="5"/><rect x="620" y="764" width="60" height="10" rx="5"/><rect x="720" y="764" width="60" height="10" rx="5"/><rect x="820" y="764" width="60" height="10" rx="5"/><rect x="920" y="764" width="60" height="10" rx="5"/><rect x="1020" y="764" width="60" height="10" rx="5"/><rect x="1120" y="764" width="60" height="10" rx="5"/><rect x="1220" y="764" width="60" height="10" rx="5"/><rect x="1320" y="764" width="60" height="10" rx="5"/><rect x="1420" y="764" width="60" height="10" rx="5"/><rect x="1520" y="764" width="60" height="10" rx="5"/>

      <use href="#lamp" transform="translate(150 674)"/><use href="#lamp" transform="translate(850 674)"/><use href="#lamp" transform="translate(1550 674)"/>

  <!-- ======== 自行车 + 鹈鹕 ======== -->
  <g id="gFar">
    <line id="crankF" x1="782" y1="706" x2="728" y2="706" stroke="#16202B" stroke-width="9" stroke-linecap="round"/>

<header class="card title">

<div class="card dock">
  <button class="btn ghost" id="pauseBtn" title="暂停/继续">⏸</button>

  <div class="speed">
    <span class="lbl">车速</span>
    <input type="range" id="slider" min="0" max="100" value="55">
    <span class="kmh" id="kmh">20<small>km/h</small></span>
  </div>
  <button class="btn ghost" id="themeBtn" title="昼夜切换">🌙</button>
  <button class="btn ghost" id="muteBtn" title="声音开关">🔊</button>
  <span class="keys">␣ 鸣笛 · ↑↓ 车速</span>
</div>

<script>
(function(){
  const ,[object Object],('spinR'), spinF:,[object Object],('chain'),
    crankN:,[object Object],('crankF'), pedalN:,[object Object],('pedalF'),
    footN:,[object Object],('footF'), legNu:,[object Object],('legNo'), legFu:,[object Object],('legFo'),
    bird:,[object Object],('arm'), pouch:,[object Object],('streaks'), bubble:,[object Object],('bubbleText'),
    bellG:,[object Object],('ripG'), hint:,[object Object],('kmh'), slider:,[object Object],('pauseBtn'), honkBtn:,[object Object],('themeBtn'), muteBtn:,[object Object],('lyrCloudFar'),14],[,[object Object],('lyrSea'),60],[,[object Object],('lyrMid'),150],[,[object Object],('lyrGrass'),700]
  ];
  const words = ['叮铃铃!','让一下~','嘿！嘿！','冲鸭！','风好大~','鹈鹕万岁!'];

  let v = 0.55, playing = true, muted = false;
  let crank = 0, wheelD = 0, chainPx = 0, t = 0, last = performance.now(), honkT = -9;
  const offs = [0,0,0,0,0,0,0];

  /* 两骨 IK：髋 -> 膝(朝前) -> 脚踏 */
  function legD(hx,hy,fx,fy){
    const L1=128, L2=128;
    let dx=fx-hx, dy=fy-hy, d=Math.hypot(dx,dy)||1;
    const cc=Math.min(L1+L2-.5, Math.max(.5, d));
    const a=(L1*L1-L2*L2+cc*cc)/(2*cc), h=Math.sqrt(Math.max(0,L1*L1-a*a));
    const mx=hx+dx*a/cc, my=hy+dy*a/cc, px=-dy/cc, py=dx/cc;
    const k1x=mx+px*h, k1y=my+py*h, k2x=mx-px*h, k2y=my-py*h;
    const k = k1x>=k2x ? [k1x,k1y] : [k2x,k2y];
    const r=n=>Math.round(n*10)/10;
    return `M,[object Object],{r(hy)} L,[object Object],{r(k[1])} L,[object Object],{r(fy)}`;
  }
  const pedal = a => [782+54*Math.cos(a), 706+54*Math.sin(a)];

  function render(){
    layers.forEach((L,i)=> L[0].setAttribute('transform', `translate(,[object Object],{(wheelD%360).toFixed(1)})`);
    E.spinF.setAttribute('transform', `rotate(,[object Object],{bob.toFixed(1)})`);

    const nD = legD(708, 522+bob, nx, ny), fD = legD(694, 516+bob, fx, fy);
    E.legNu.setAttribute('d',nD); E.legNo.setAttribute('d',nD);
    E.legFu.setAttribute('d',fD); E.legFo.setAttribute('d',fD);
    E.crankN.setAttribute('x2',nx.toFixed(1)); E.crankN.setAttribute('y2',ny.toFixed(1));
    E.crankF.setAttribute('x2',fx.toFixed(1)); E.crankF.setAttribute('y2',fy.toFixed(1));
    E.pedalN.setAttribute('transform',`translate(,[object Object],{ny.toFixed(1)})`);
    E.pedalF.setAttribute('transform',`translate(,[object Object],{fy.toFixed(1)})`);
    E.footN.setAttribute('transform',`translate(,[object Object],{(ny-3).toFixed(1)})`);
    E.footF.setAttribute('transform',`translate(,[object Object],{(fy-3).toFixed(1)})`);

    let pouchRot = 0, armRot = Math.sin(crank*2+1)*2.5*Math.min(1,v*2);
    const hp = t - honkT;
    if (hp < .7){ const p=hp/.7; pouchRot=Math.sin(p*Math.PI*3)*11*(1-p); armRot+=Math.sin(p*Math.PI*4)*16*(1-p); }
    if (v === 0) pouchRot = 6 + Math.sin(t*2)*1.5;
    E.pouch.setAttribute('transform', `rotate(,[object Object],{armRot.toFixed(1)} 756 436)`);

    E.streaks.setAttribute('opacity', Math.max(0, Math.min(.85,(v-.35)*1.8)).toFixed(2));
  }

  function frame(now){
    const dt = Math.min(.05,(now-last)/1000); last = now; t += dt;
    if (playing){
      const w = v>0 ? 5.2*v : 0;
      crank += w*dt; wheelD += 950*v*dt; chainPx += w*dt*30;
      for(let i=0;i<layers.length;i++) offs[i] = (offs[i] + layers[i][1]*v*dt) % 1600;
    }
    render();
    requestAnimationFrame(frame);
  }

  /* ---- 声音 ---- */
  let AC = null;
  function strike(t0){
    [[2350,.12],[3520,.05],[4180,.03]].forEach(([f,a])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0);
      g.gain.exponentialRampToValueAtTime(a,t0+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t0+.55);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+.6);
    });
  }
  function ding(){
    if (muted) return;
    try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      if (AC.state==='suspended') AC.resume();
      const t0=AC.currentTime; strike(t0); strike(t0+.14);
    }catch(e){}
  }

  let bt = null;
  function honk(){
    honkT = t;
    E.bubbleText.textContent = words[Math.floor(Math.random()*words.length)];
    E.bubble.classList.add('show');
    clearTimeout(bt); bt = setTimeout(()=>E.bubble.classList.remove('show'), 1000);
    E.bellG.classList.remove('ring'); void E.bellG.getBBox(); E.bellG.classList.add('ring');
    E.ripG.classList.remove('go'); void E.ripG.getBBox(); E.ripG.classList.add('go');
    E.hint.classList.add('gone');
    ding();
  }

  function setV(x){
    v = Math.max(0, Math.min(1, x));
    E.slider.value = Math.round(v*100);
    E.slider.style.setProperty('--p', (v*100)+'%');
    E.kmh.innerHTML = Math.round(v*36) + '<small>km/h</small>';
  }

  /* ---- 事件 ---- */
  E.slider.addEventListener('input', e => setV(e.target.value/100));
  E.honkBtn.addEventListener('click', honk);
  $('scene').addEventListener('click', honk);
  E.pauseBtn.addEventListener('click', ()=>{ playing=!playing; E.pauseBtn.textContent = playing?'⏸':'▶'; });
  E.themeBtn.addEventListener('click', ()=>{
    document.body.classList.toggle('night');
    E.themeBtn.textContent = document.body.classList.contains('night') ? '☀️' : '🌙';
  });
  E.muteBtn.addEventListener('click', ()=>{ muted=!muted; E.muteBtn.textContent = muted?'🔇':'🔊'; });
  window.addEventListener('keydown', e=>{
    if (e.code==='Space'){ e.preventDefault(); honk(); }
    else if (e.key==='ArrowUp' || e.key==='ArrowRight') setV(v+.05);
    else if (e.key==='ArrowDown' || e.key==='ArrowLeft') setV(v-.05);
    else if (e.key==='n'||e.key==='N') E.themeBtn.click();
    else if (e.key==='m'||e.key==='M') E.muteBtn.click();
  });

  E.slider.style.setProperty('--p','55%');
  requestAnimationFrame(frame);
})();
</script>
